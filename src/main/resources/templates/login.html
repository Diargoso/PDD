<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Вход в экзамен ПДД</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            min-height: 100vh;
            background: radial-gradient(circle at 10% 20%, rgba(5, 15, 25, 0.95), rgba(0, 0, 0, 0.98));
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            padding: 24px;
            position: relative;
            overflow-x: hidden;
        }

        .orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.4;
            z-index: -1;
            animation: float 20s infinite alternate ease-in-out;
        }
        .orb1 { width: 50vw; height: 50vw; background: #00c6ff; top: -20vh; left: -20vw; }
        .orb2 { width: 40vw; height: 40vw; background: #ff4d6d; bottom: -15vh; right: -10vw; animation-duration: 25s; }
        .orb3 { width: 35vw; height: 35vw; background: #9d4edd; bottom: 20%; left: 20%; animation-duration: 18s; opacity: 0.3; }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(3%, 5%) scale(1.1); }
        }

        .glass-panel {
            max-width: 500px;
            margin: 80px auto;
            background: rgba(20, 25, 40, 0.55);
            backdrop-filter: blur(16px);
            border-radius: 56px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4), 0 0 0 0.5px rgba(255, 255, 255, 0.08) inset;
            overflow: hidden;
        }

        .login-body {
            padding: 2rem;
        }
        .login-body p {
            color: #eef5ff;
            margin-bottom: 1.5rem;
            font-size: 1rem;
            text-align: center;
        }
        .form-group {
            margin-bottom: 1.5rem;
        }
        .form-label {
            display: block;
            margin-bottom: 0.5rem;
            color: #b0c4f0;
            font-weight: 500;
        }
        .form-control {
            width: 100%;
            padding: 12px 20px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 40px;
            font-size: 1rem;
            color: #fff;
            outline: none;
            transition: 0.2s;
        }
        .form-control:focus {
            border-color: #4facfe;
            box-shadow: 0 0 12px rgba(79, 172, 254, 0.3);
        }
        .btn {
            width: 100%;
            padding: 12px 28px;
            border-radius: 60px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.2s;
            font-family: inherit;
            border: none;
            background: linear-gradient(95deg, #ff8c42, #ff3b6f);
            color: white;
            box-shadow: 0 4px 12px rgba(255, 50, 80, 0.4);
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .btn:hover {
            transform: scale(0.97);
            filter: brightness(1.05);
        }
        .alert {
            padding: 10px 16px;
            border-radius: 40px;
            margin-bottom: 1rem;
            font-size: 0.9rem;
            font-weight: 500;
        }
        .alert-danger {
            background: rgba(255, 77, 77, 0.2);
            color: #ffaaaa;
            border: 1px solid rgba(255, 77, 77, 0.4);
        }

        footer {
            text-align: center;
            padding: 1rem;
            font-size: 0.7rem;
            color: #aab7d4;
        }
    </style>
    <div th:replace="~{fragments/header :: header-styles}"></div>
</head>
<body>
<div class="orb orb1"></div>
<div class="orb orb2"></div>
<div class="orb orb3"></div>

<div class="glass-panel">
    <div th:replace="~{fragments/header :: header}"></div>
    <div class="login-body">
        <p>Введите ключ, выданный инструктором, чтобы начать тест по вашей категории.</p>
        <form th:action="@{/login}" method="post">
            <div class="form-group">
                <label for="keyInput" class="form-label">Ключ доступа</label>
                <input type="text" class="form-control" id="keyInput" name="key" placeholder="Например: ZdaRf" required autofocus>
            </div>
            <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
            <button type="submit" class="btn">🚦 Начать экзамен</button>
        </form>
    </div>
    <footer>2026 · безопасная аутентификация</footer>
</div>
</body>
</html>
